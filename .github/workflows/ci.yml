name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# One workflow, one DAG:
#   ┌─ go-test ───┐
#   ├─ test ──────┼─> wheels ──> publish (PyPI)
#   └─ validation ┘            ╲
#                                └─> github-release
#
# - go-test runs `go vet` + `go test -race ./...` on linux + macOS (on linux also
#   the 10g/11g/12c password-verifier tests against an Oracle 21c service, and the
#   NNE tests against servers that require and reject Native Network Encryption)
# - test runs the Python unit + integration suite (6 Pythons × 3 OS)
# - validation runs the adbc-drivers.org driver validation suite against
#   Oracle 23ai (validation/README.md); it fails, never skips, without a server
# - both run on every PR, branch push, and tag push
# - wheels run only on tag push, gated on all three test jobs passing
# - publish (PyPI) and github-release run only on tag push, gated on
#   all wheels building successfully

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Decides whether this run is about code (code=true) or documentation only (code=false). Every
  # other job needs it and runs only when code=true; "CI result" at the end is the one required
  # check. code=false only when every changed file is *.md, docs/**, LICENSE, NOTICE or
  # .github/ISSUE_TEMPLATE/** (workflow files are code). Tags, workflow_dispatch, schedule and any
  # other event (including release.yml calling this workflow, which carries the caller's tag push
  # or dispatch) always test everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Code or documentation only?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          code=true
          range=
          case "$EVENT:$REF" in
            *:refs/tags/*) reason="a tag ($REF)" ;;
            pull_request:*) range="$PR_BASE...$SHA" ;;
            push:refs/heads/*)
              if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ]; then
                reason="a new branch"
              elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                reason="the previous head $BEFORE is not in the history (force push)"
              else
                range="$BEFORE..$SHA"
              fi
              ;;
            *) reason="a $EVENT run on $REF" ;;
          esac
          if [ -n "$range" ]; then
            # --no-renames: a rename lists both paths, so moving code into docs/ is still code.
            files=$(git diff --no-renames --name-only "$range")
            count=0
            code=false
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              count=$((count + 1))
              case "$f" in
                *.md | docs/* | LICENSE | NOTICE | .github/ISSUE_TEMPLATE/*) echo "docs: $f" ;;
                *) echo "code: $f"; code=true ;;
              esac
            done <<< "$files"
            if [ "$count" -eq 0 ]; then
              code=true
              reason="no changed files in $range"
            elif [ "$code" = true ]; then
              reason="code changed in $range"
            else
              reason="only documentation changed in $range ($count files)"
            fi
          fi
          echo "code=$code ($reason)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "**Changes:** code=\`$code\` ($reason)" >> "$GITHUB_STEP_SUMMARY"

  go-test:
    name: Go tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    services:
      oracle:
        # GitHub Actions service containers only run on Linux runners;
        # on macOS/Windows this block is ignored and integration tests skip.
        image: ${{ startsWith(matrix.os, 'ubuntu') && 'gvenzl/oracle-free:23-faststart' || '' }}
        env:
          ORACLE_PASSWORD: tiger
          APP_USER: scott
          APP_USER_PASSWORD: tiger
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
      oracle_xe21:
        # Oracle 21c for the password-verifier tests (driver/oracle/verifier_live_test.go):
        # 23ai and later can no longer hold an account with only a 10g verifier.
        image: ${{ startsWith(matrix.os, 'ubuntu') && 'gvenzl/oracle-xe:21-slim-faststart' || '' }}
        env:
          ORACLE_PASSWORD: tiger
        ports:
          - 1522:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
      oracle_nne:
        # Native Network Encryption: scripts/setup_nne_server.sh below makes this server require
        # NNE and the next one reject it (internal/ttc/live_nne_test.go).
        image: ${{ startsWith(matrix.os, 'ubuntu') && 'gvenzl/oracle-free:23-slim-faststart' || '' }}
        env:
          ORACLE_PASSWORD: tiger
          APP_USER: scott
          APP_USER_PASSWORD: tiger
        ports:
          - 1523:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
      oracle_nne_rejected:
        image: ${{ startsWith(matrix.os, 'ubuntu') && 'gvenzl/oracle-free:23-slim-faststart' || '' }}
        env:
          ORACLE_PASSWORD: tiger
          APP_USER: scott
          APP_USER_PASSWORD: tiger
        ports:
          - 1524:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      ADBC_ORACLE_TEST_URI: ${{ startsWith(matrix.os, 'ubuntu') && 'oracle://scott:tiger@localhost:1521/FREEPDB1' || '' }}
      # The full (non-slim) image includes Oracle Spatial, needed for the
      # SDO_GEOMETRY -> GeoArrow tests.
      ADBC_ORACLE_SPATIAL_URI: ${{ startsWith(matrix.os, 'ubuntu') && 'oracle://scott:tiger@localhost:1521/FREEPDB1' || '' }}
      # Accounts with only a 10g / 11g / 12c password verifier, made by
      # scripts/setup_verifier_users.sh below. With VERIFIERS_REQUIRED the tests
      # fail, never skip, when a URI is missing.
      ADBC_ORACLE_TEST_10G_URI: ${{ startsWith(matrix.os, 'ubuntu') && 'oracle://adbc_test_10g:Tiger10g@127.0.0.1:1522/XEPDB1' || '' }}
      ADBC_ORACLE_TEST_11G_URI: ${{ startsWith(matrix.os, 'ubuntu') && 'oracle://adbc_test_11g:Tiger11g@127.0.0.1:1522/XEPDB1' || '' }}
      ADBC_ORACLE_TEST_12C_URI: ${{ startsWith(matrix.os, 'ubuntu') && 'oracle://adbc_test_12c:Tiger12c@127.0.0.1:1522/XEPDB1' || '' }}
      ADBC_ORACLE_TEST_VERIFIERS_REQUIRED: ${{ startsWith(matrix.os, 'ubuntu') && 'true' || '' }}
      # The NNE-required and NNE-rejecting servers. internal/ttc's live tests fail, never skip,
      # when their URI is set and the server doesn't answer (on macOS these are empty: skip).
      ADBC_ORACLE_NNE_URI: ${{ startsWith(matrix.os, 'ubuntu') && 'oracle://scott:tiger@127.0.0.1:1523/FREEPDB1' || '' }}
      ADBC_ORACLE_NNE_REJECTED_URI: ${{ startsWith(matrix.os, 'ubuntu') && 'oracle://scott:tiger@127.0.0.1:1524/FREEPDB1' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false

      - name: Create the single-verifier accounts (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: scripts/setup_verifier_users.sh "${{ job.services.oracle_xe21.id }}" XEPDB1

      - name: Make one server require NNE and one reject it (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          scripts/setup_nne_server.sh "${{ job.services.oracle_nne.id }}" REQUIRED
          scripts/setup_nne_server.sh "${{ job.services.oracle_nne_rejected.id }}" REJECTED

      - name: go vet
        run: go vet ./...

      - name: go test
        # -v, so the log names every test and the next step can check that none was skipped.
        run: |
          set -o pipefail
          go test -race -timeout 5m -v ./... 2>&1 | tee go-test.log

      - name: The live tests ran, none skipped (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          if grep -E -- '--- SKIP: TestLive' go-test.log; then
            echo "::error::live tests were skipped although their servers are configured"
            exit 1
          fi
          for t in TestLiveConnectAndQuery TestLiveNNE TestLiveNNEClientDriven TestLiveNNERejectedServer; do
            if ! grep -E -- "--- PASS: $t " go-test.log; then
              echo "::error::$t did not pass"
              exit 1
            fi
          done

  test:
    name: Python tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    # Only the Linux legs get a live Oracle Database (GitHub Actions
    # service containers are Linux-only); macOS / Windows run the unit
    # tests and the integration suite auto-skips there. If we ship a
    # wheel for a platform, its unit tests must pass.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    defaults:
      run:
        shell: bash
    services:
      oracle:
        # GitHub Actions service containers only run on Linux runners;
        # on macOS/Windows this block is ignored and integration tests skip.
        image: ${{ startsWith(matrix.os, 'ubuntu') && 'gvenzl/oracle-free:23-faststart' || '' }}
        env:
          ORACLE_PASSWORD: tiger
          APP_USER: scott
          APP_USER_PASSWORD: tiger
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      ADBC_ORACLE_TEST_URI: ${{ startsWith(matrix.os, 'ubuntu') && 'oracle://scott:tiger@localhost:1521/FREEPDB1' || '' }}
      # The full (non-slim) image includes Oracle Spatial, needed for the
      # SDO_GEOMETRY -> GeoArrow tests.
      ADBC_ORACLE_SPATIAL_URI: ${{ startsWith(matrix.os, 'ubuntu') && 'oracle://scott:tiger@localhost:1521/FREEPDB1' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install clang-format (macOS)
        if: matrix.os == 'macos-latest'
        # The runner image ships with aws/tap pre-tapped, which trips
        # Homebrew's tap-trust warning on every brew command. We don't
        # use anything from it — untap it first (with the trust check
        # suppressed for that one command so the untap itself is quiet).
        run: |
          HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew untap aws/tap 2>/dev/null || true
          brew install clang-format

      - name: Install goimports + clang-format (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Pinned: an unpinned @latest moved to x/tools v0.52 (needs Go 1.26) and broke CI on its own.
          go install golang.org/x/tools/cmd/goimports@v0.52.0
          sudo apt-get update && sudo apt-get install -y clang-format

      - name: Build c-shared driver library
        run: |
          export PATH="$HOME/go/bin:$PATH"
          case "${{ runner.os }}" in
            macOS)   SUFFIX=dylib ;;
            Windows) SUFFIX=dll   ;;
            *)       SUFFIX=so    ;;
          esac
          # The build script limits the exports to the ADBC entrypoints.
          bash scripts/build_lib.sh "pkg/oracle/libadbc_driver_oracle.${SUFFIX}"
          go run ./scripts/checkexports -allow OracleDriverInit "pkg/oracle/libadbc_driver_oracle.${SUFFIX}"
          LIB_PATH="$PWD/pkg/oracle/libadbc_driver_oracle.${SUFFIX}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Git Bash $PWD is /d/a/... — translate to D:/a/... so that
            # Python's pathlib and setup.py's shutil.copy can find it.
            LIB_PATH=$(cygpath -m "$LIB_PATH")
          fi
          echo "ADBC_ORACLE_LIBRARY=${LIB_PATH}" >> "$GITHUB_ENV"

      - name: Start Hardcharger
        # The Oracle -> Hardcharger tests (test-only dependency; the driver itself
        # has no Hardcharger code). Linux only, like the Oracle service, and not on
        # Python 3.10, which the Hardcharger client doesn't support. Started after
        # the build so the server can load this commit's driver library for the
        # adbc_scanner tests; host networking lets it reach the Oracle service.
        if: startsWith(matrix.os, 'ubuntu') && matrix.python != '3.10'
        run: |
          for i in 1 2 3 4 5; do docker pull -q "$HARDCHARGER_IMAGE" && break; [ $i = 5 ] && exit 1; sleep $((i * 15)); done
          docker run -d --name hardcharger --network host \
            -v "$PWD/pkg/oracle:/drivers:ro" \
            -e HARDCHARGER_ADMIN_USERNAME=hardcharger -e HARDCHARGER_ADMIN_PASSWORD=hardcharger \
            "$HARDCHARGER_IMAGE"
          docker run --rm "$HARDCHARGER_IMAGE" --version
          {
            echo "ADBC_ORACLE_TEST_HARDCHARGER_URI=hardcharger://127.0.0.1:31337?tls=false"
            echo "ADBC_ORACLE_TEST_HARDCHARGER_DRIVER_PATH=/drivers/libadbc_driver_oracle.so"
          } >> "$GITHUB_ENV"
        env:
          HARDCHARGER_IMAGE: ghcr.io/gizmodata/hardcharger:latest

      - name: Install Python wheel from source tree
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,hardcharger]"

      - name: Run Python tests
        # No -m filter: run the unit tests (manifest writer etc.) plus
        # the integration suite against the Oracle service container
        # (Linux) — integration tests self-skip where no DB is reachable.
        run: pytest -v

      - name: Upload c-shared driver library
        # Only upload once per OS — every python version produces the
        # same binary so we keep the 3.12 build to avoid duplicates.
        # (Use 3.12 specifically because that's the version the wheel
        # job below uses.)
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: libadbc_driver_oracle-${{ runner.os }}
          path: pkg/oracle/libadbc_driver_oracle.*
          if-no-files-found: error

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python }}
          path: |
            *.log
            python/*.log

  validation:
    name: ADBC validation suite
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: tiger
          APP_USER: scott
          APP_USER_PASSWORD: tiger
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      ADBC_ORACLE_TEST_URI: oracle://scott:tiger@127.0.0.1:1521/FREEPDB1
      ADBC_ORACLE_TEST_ADMIN_URI: oracle://system:tiger@127.0.0.1:1521/FREEPDB1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false

      - uses: actions/setup-python@v7
        with:
          # The suite needs Python 3.13+.
          python-version: '3.14'

      - name: Build c-shared driver library
        run: make -C pkg/oracle

      - name: Check the library's exports
        run: go run ./scripts/checkexports -allow OracleDriverInit pkg/oracle/libadbc_driver_oracle.so

      - name: Install the validation suite (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r validation/requirements.txt

      - name: Run the validation suite
        run: python -m pytest -rfEsxX --junit-xml=validation-report.xml validation/tests/

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: validation-report.xml
          if-no-files-found: ignore

  wheels:
    # Builds the wheel AND smoke-tests it from a clean venv, so
    # packaging bugs (wrong-binary-bundled, missing dep, wrong platform
    # tag, etc.) trip CI before publish — not after a PyPI release.
    # Runs on every PR / branch / tag push; only publish + release jobs
    # are tag-gated.
    name: Wheel ${{ matrix.os }} ${{ matrix.arch }}
    needs: [changes, go-test, test, validation]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    services:
      oracle:
        image: ${{ matrix.runner == 'ubuntu-latest' && 'gvenzl/oracle-free:23-faststart' || '' }}
        env:
          ORACLE_PASSWORD: tiger
          APP_USER: scott
          APP_USER_PASSWORD: tiger
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      ADBC_ORACLE_TEST_URI: ${{ matrix.runner == 'ubuntu-latest' && 'oracle://scott:tiger@localhost:1521/FREEPDB1' || '' }}
      ADBC_ORACLE_SPATIAL_URI: ${{ matrix.runner == 'ubuntu-latest' && 'oracle://scott:tiger@localhost:1521/FREEPDB1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: so
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: so
          - os: macos
            arch: arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            ext: dylib
          - os: windows
            arch: x86_64
            runner: windows-latest
            goos: windows
            goarch: amd64
            ext: dll
          # dll_only: pyarrow and adbc-driver-manager publish no
          # win_arm64 wheels yet, so an adbc-driver-oracle wheel could
          # never pip-install on Windows ARM. Ship the c-shared driver
          # DLL as a release artifact (Go / C / driver-manifest
          # consumers) and flip dll_only off once upstream wheels exist.
          - os: windows
            arch: arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            ext: dll
            dll_only: true
            # llvm-mingw clang warns that cgo's generated export-header
            # prolog re-adds dllexport to declarations from exports.go —
            # a cosmetic cgo artifact (gcc doesn't warn) that GitHub's
            # problem matcher renders as red "error" annotations.
            extra_cflags: -Wno-dll-attribute-on-redeclaration
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false

      - uses: actions/setup-python@v7
        if: ${{ !matrix.dll_only }}
        with:
          python-version: '3.12'

      # Linux: build the c-shared library with `zig cc` against glibc 2.17, so the wheel's
      # manylinux2014 tag (set in setup.py) is true. Built with the runner's gcc it needed
      # GLIBC_2.32 and failed to load on Oracle Linux 8 (glibc 2.28) database servers.
      - uses: mlugg/setup-zig@v2
        if: ${{ matrix.goos == 'linux' }}
        with:
          version: 0.14.1

      - name: Install llvm-mingw (cgo C toolchain for windows/arm64)
        if: ${{ matrix.dll_only }}
        shell: bash
        # A pinned, checksummed release, not "latest" through the GitHub API:
        # that anonymous API call can be rate-limited and return no URL, which
        # failed adbc-driver-oracle's v1.0.4 release run once.
        env:
          LLVM_MINGW_TAG: '20261104'
          LLVM_MINGW_SHA256: 7d7f8387a8706639b0b47a629d6e23f8b3ef9acce67e9832b8cd4c5bb2816eab
        run: |
          set -euo pipefail
          name="llvm-mingw-${LLVM_MINGW_TAG}-ucrt-aarch64"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/llvm-mingw.zip" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/${name}.zip"
          actual=$(sha256sum < "$RUNNER_TEMP/llvm-mingw.zip" | cut -d' ' -f1)
          if [ "$actual" != "$LLVM_MINGW_SHA256" ]; then
            echo "::error::${name}.zip has SHA-256 $actual, expected $LLVM_MINGW_SHA256"
            exit 1
          fi
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP/llvm-mingw"
          tooldir="$RUNNER_TEMP/llvm-mingw/${name}"
          echo "$tooldir/bin" >> "$GITHUB_PATH"
          echo "CC=$tooldir/bin/aarch64-w64-mingw32-clang" >> "$GITHUB_ENV"

      - name: Build c-shared driver library
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          # Keep cgo's default flags and append per-platform extras
          # (setting CGO_CFLAGS at all replaces the "-O2 -g" default).
          CGO_CFLAGS: -O2 -g ${{ matrix.extra_cflags }}
          # Tag the macOS library and wheel for macOS 13+, the oldest macOS
          # the Go 1.27 runtime supports (go.dev/doc/go1.27), rather than only
          # the runner's own release (it was tagged macosx_26_0). Keep this in
          # step with the Go toolchain: 12.0 let pip install it where Go can't run.
          MACOSX_DEPLOYMENT_TARGET: '13.0'

        run: |
          if [ "${{ matrix.goos }}" = "linux" ]; then
            export CC="zig cc -target $([ "${{ matrix.goarch }}" = arm64 ] && echo aarch64 || echo x86_64)-linux-gnu.2.17"
          fi
          bash scripts/build_lib.sh "pkg/oracle/libadbc_driver_oracle.${{ matrix.ext }}"
          echo "ADBC_ORACLE_LIBRARY=$PWD/pkg/oracle/libadbc_driver_oracle.${{ matrix.ext }}" >> "$GITHUB_ENV"

      - name: Check the library's exports
        # ADBC shared-library requirements: AdbcDriverInit and AdbcDriverOracleInit
        # (from the file name), nothing else without the Adbc prefix except the
        # deprecated OracleDriverInit alias.
        shell: bash
        run: go run ./scripts/checkexports -allow OracleDriverInit "pkg/oracle/libadbc_driver_oracle.${{ matrix.ext }}"

      - name: Check the glibc ceiling (2.17, the manylinux2014 tag)
        if: ${{ matrix.goos == 'linux' }}
        run: |
          MAX=$(objdump -T pkg/oracle/libadbc_driver_oracle.so | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "highest glibc symbol version: ${MAX:-none}"
          if [ -n "$MAX" ] && [ "$(printf '%s\n2.17\n' "$MAX" | sort -V | tail -1)" != "2.17" ]; then
            echo "::error::libadbc_driver_oracle.so needs glibc $MAX, but the wheel is tagged manylinux2014 (2.17)"
            exit 1
          fi

      - name: Build wheel
        if: ${{ !matrix.dll_only }}
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          ls -la dist/

      - name: Check the macOS wheel tag against the library
        # pip trusts the tag: it must name the library's real minimum macOS and
        # architecture (an arm64-only library once shipped as universal2).
        if: ${{ matrix.goos == 'darwin' }}
        run: |
          set -euo pipefail
          WHEEL=$(basename dist/*.whl)
          LIB=pkg/oracle/libadbc_driver_oracle.dylib
          MINOS=$(otool -l "$LIB" | awk '/LC_BUILD_VERSION/{f=1} f && $1=="minos"{print $2; exit}')
          ARCHS=$(lipo -archs "$LIB")
          echo "wheel: $WHEEL  library: minos $MINOS, archs $ARCHS"
          WANT="macosx_${MINOS//./_}_${ARCHS}"
          case "$WHEEL" in
            *"-${WANT}.whl") ;;
            *) echo "::error::$WHEEL should be tagged $WANT"; exit 1 ;;
          esac

      - name: Smoke-test wheel in a clean venv
        if: ${{ !matrix.dll_only }}
        # Install the freshly built wheel into a fresh venv (no source
        # tree on PYTHONPATH) and run the integration suite from a copy
        # of python/tests/ outside the repo. Catches bugs that the
        # editable-install path in the `test` job can't see:
        #   - wrong/missing binary in the wheel (py3-none-any.whl trap)
        #   - missing runtime dep (pyarrow was once in dbapi extra)
        #   - import paths broken in installed layout
        shell: bash
        run: |
          set -e
          VENV="${RUNNER_TEMP}/wheel-smoke-venv"
          rm -rf "$VENV"
          python -m venv "$VENV"
          if [ "${{ runner.os }}" = "Windows" ]; then
            VPY="$VENV/Scripts/python.exe"
          else
            VPY="$VENV/bin/python"
          fi
          "$VPY" -m pip install --upgrade pip --quiet
          WHEEL=$(ls dist/*.whl | head -1)
          echo "Installing $WHEEL plus test dependencies"
          "$VPY" -m pip install "$WHEEL" pytest pandas --quiet
          # Run tests from a copy outside the source tree so the package
          # has to resolve via the wheel install, not the source dir.
          # The tests use package-relative imports (from .conftest import
          # ...), so keep them as a `tests` package under a fresh rootdir.
          TESTS="${RUNNER_TEMP}/wheel-smoke"
          rm -rf "$TESTS"
          mkdir -p "$TESTS"
          cp -R python/tests "$TESTS/tests"
          cd "$TESTS"
          "$VPY" -m pytest -v \
            --override-ini='markers=integration: integration tests
              hardcharger: needs Hardcharger
              duckdb_ext: needs duckdb + adbc_scanner' tests

      - name: Upload wheel artifact
        if: ${{ !matrix.dll_only }}
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

      - name: Stage c-shared library + checksum for release
        # One archive per platform, holding the library under the name the driver
        # manager expects (libadbc_driver_oracle.<ext>, so it derives the
        # AdbcDriverOracleInit entrypoint) plus LICENSE and NOTICE. A renamed raw
        # library (libadbc_driver_oracle-linux-amd64.so) made it look for
        # AdbcDriverOracleLinuxAmd64Init.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts stage
          base="libadbc_driver_oracle-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          cp "pkg/oracle/libadbc_driver_oracle.${{ matrix.ext }}" LICENSE NOTICE stage/
          tar -czf "release-artifacts/${base}" -C stage "libadbc_driver_oracle.${{ matrix.ext }}" LICENSE NOTICE
          tar -tzvf "release-artifacts/${base}"
          if command -v sha256sum > /dev/null 2>&1; then
            (cd release-artifacts && sha256sum "${base}" > "${base}.sha256")
          else
            (cd release-artifacts && shasum -a 256 "${base}" > "${base}.sha256")
          fi

      - name: Upload c-shared library artifact
        uses: actions/upload-artifact@v7
        with:
          name: libadbc_driver_oracle-release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-artifacts/*

  oracle-linux-8:
    # The Linux wheels must install and load on a glibc-2.28 distro (Oracle Linux 8 / RHEL 8):
    # the database servers this driver exists for. Loading the library is the portability check
    # (dlopen fails on a missing GLIBC_x.y symbol version); a refused connection proves it loaded.
    name: Wheel on oracle linux 8 (${{ matrix.arch }})
    needs: [changes, wheels]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: oraclelinux:8
    steps:
      - name: Install Python 3.12
        # A mirror can serve a broken repomd.xml ("repomd.xml parser error"), and dnf's own
        # retries (--setopt=retries) cover failed downloads, not a bad file: it fetches it once
        # and gives up. So retry the whole install with fresh metadata.
        run: |
          for i in 1 2 3 4 5; do
            if dnf install -y -q python3.12 python3.12-pip; then break; fi
            if [ "$i" -eq 5 ]; then echo "::error::dnf install failed 5 times"; exit 1; fi
            dnf clean metadata || true
            sleep $((i * 15))
          done

      - uses: actions/download-artifact@v8
        with:
          name: wheel-linux-${{ matrix.arch }}
          path: dist

      - name: Install the wheel and load the driver
        run: |
          ldd --version | head -1
          python3.12 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q dist/*.whl
          /tmp/venv/bin/python - <<'PY'
          import adbc_driver_oracle.dbapi as oracle
          try:
              oracle.connect(uri="oracle://u:p@127.0.0.1:1/none").close()
          except Exception as e:
              message = str(e)
              print(type(e).__name__, message[:300])
              assert not any(s in message for s in ("GLIBC", "dlopen", "Could not load")), "driver library failed to load"
          else:
              raise SystemExit("expected a refused connection")
          PY

  publish:
    name: Publish to PyPI
    needs: [changes, wheels, oracle-linux-8]
    if: startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/adbc-driver-oracle
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage wheels for PyPI
        run: |
          mkdir -p dist
          # Wheels live under artifacts/wheel-<os>-<arch>/*.whl
          find artifacts -type d -name 'wheel-*' -exec cp -r {}/. dist/ \;
          ls -la dist/

      - name: Publish to PyPI via OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    name: Attach c-shared libraries to GitHub Release
    needs: [changes, wheels, oracle-linux-8]
    if: startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          # Strip the leading 'v' from the tag (refs/tags/v1.2.3 -> 1.2.3)
          # and pull the matching "## [VERSION] ..." section out of
          # CHANGELOG.md (stop at the next "## [" heading). Save to
          # release_notes.md; fall back to an empty file so the release
          # still gets created with auto-generated notes.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Extracting release notes for version: ${VERSION}"
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ -s release_notes.md ]; then
            echo "---- release_notes.md ----"
            cat release_notes.md
          else
            echo "WARNING: no matching CHANGELOG section for ${VERSION}; release will use auto-generated notes."
          fi

      - name: Stage c-shared library bundle
        run: |
          mkdir -p release-bundle
          find artifacts -type d -name 'libadbc_driver_oracle-release-*' -exec cp -r {}/. release-bundle/ \;
          # One combined checksum manifest across every platform.
          (cd release-bundle && sha256sum libadbc_driver_oracle-*.tar.gz > SHA256SUMS)
          cat release-bundle/SHA256SUMS
          # Five platforms: linux amd64/arm64, darwin arm64, windows amd64/arm64.
          test "$(wc -l < release-bundle/SHA256SUMS)" -eq 5
          ls -la release-bundle/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            release-bundle/libadbc_driver_oracle-*
            release-bundle/SHA256SUMS
          generate_release_notes: true
          draft: false
          # Semver pre-release tags (v1.0.0-rc1, ...) get a pre-release
          # GitHub Release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  pkgsite-warm:
    name: Warm pkg.go.dev cache
    needs: [changes, publish, github-release]
    if: startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pkg.go.dev fetch
        # pkg.go.dev indexes Go modules on demand — the first visitor to
        # github.com/gizmodata/adbc-driver-oracle@<new tag> would otherwise
        # see the "Fetch" stub page. POSTing to the same fetch endpoint
        # the page's "Request" button uses warms the cache for everyone.
        # `|| true` because the endpoint isn't a contractually stable
        # public API, and pkg.go.dev rate-limits during heavy load.
        run: |
          ref="${GITHUB_REF_NAME}"
          curl -sS -X POST \
            "https://pkg.go.dev/fetch/github.com/gizmodata/adbc-driver-oracle@${ref}" \
            -o /dev/null -w "pkg.go.dev fetch (${ref}): HTTP %{http_code} in %{time_total}s\n" \
            || true

  # The one required status check. It fails when any job failed or was cancelled, and when the
  # change is code but a job that must run was skipped; for a documentation-only change the
  # skipped jobs pass. Jobs in OPTIONAL skip by their own conditions (tag-only publishing).
  ci-result:
    name: CI result
    if: always()
    needs: [changes, go-test, test, validation, wheels, oracle-linux-8, publish, github-release, pkgsite-warm]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed, or was skipped for a documentation-only change
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          OPTIONAL: "publish github-release pkgsite-warm"
        run: |
          set -euo pipefail
          changes=$(jq -r '.changes.result' <<< "$NEEDS")
          if [ "$changes" != success ] || { [ "$CODE" != true ] && [ "$CODE" != false ]; }; then
            echo "::error::the Changes job didn't decide (result: $changes, code: '$CODE')"
            exit 1
          fi
          failed=0
          while read -r job result; do
            optional=false
            for o in $OPTIONAL; do if [ "$o" = "$job" ]; then optional=true; fi; done
            case "$result" in
              success) echo "ok       $job" ;;
              skipped)
                if [ "$CODE" = true ] && [ "$optional" = false ]; then
                  echo "::error::$job was skipped, but this change is code: it must run"
                  failed=1
                else
                  echo "skipped  $job"
                fi
                ;;
              *) echo "::error::$job: $result"; failed=1 ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          exit "$failed"
